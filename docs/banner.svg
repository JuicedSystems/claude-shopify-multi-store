    <g fill="#95bf47"><path d="M56 70h24l-3 18h-18z"/><path d="M46 152h24l-3 18h-18z"/><path d="M72 227h24l-3 18h-18z"/></g>
    <circle cx="150" cy="150" r="26" fill="#d97757"/>
    <circle cx="150" cy="150" r="10" fill="#14181f"/>
    <circle cx="236" cy="150" r="8" fill="#d97757"/>
    <text x="290" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f4f5f7">Shopify Multi-Store Connector</text>
    <text x="292" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#b6bdc9">Many Shopify stores, one Claude plugin. Every tool names its store.</text>
    <text x="292" y="226" font-family="Consolas, Menlo, monospace" font-size="18" fill="#95bf47">store: "keg-smiths" | "store-two"   ·   19 tools   ·   zero dependencies</text>
