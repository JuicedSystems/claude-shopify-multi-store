<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Shopify Multi-Store Connector for Claude: every tool names its store">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14181f"/><stop offset="1" stop-color="#1c2330"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="6" fill="#95bf47"/>
    <!-- hub and spokes: one connector, several stores -->
    <g stroke="#95bf47" stroke-width="2.5" stroke-opacity="0.7" fill="none">
      <path d="M150 150 L70 80"/><path d="M150 150 L60 160"/><path d="M150 150 L85 235"/><path d="M150 150 L230 150" stroke="#d97757"/>
    </g>
    <g fill="#1c2330" stroke="#95bf47" stroke-width="3">
