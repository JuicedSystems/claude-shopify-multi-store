name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate plugin manifests
        run: |
          node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','stores.example.json','mcp/package.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('ok', f) }"
      - name: Syntax check + MCP smoke test
        working-directory: mcp
        run: npm test
